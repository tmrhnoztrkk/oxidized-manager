# End-to-end test bed: two Oxidized Manager installations, three fake IOS devices and a Gitea server.
#   ./tests/e2e/run.sh
name: oxmgr-e2e

x-manager: &manager
  image: oxidized-manager:e2e
  environment:
    BACKUP_SCHEDULER: "false"
  healthcheck:
    test: ["CMD", "/opt/oxmgr/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
    interval: 3s
    retries: 40

services:
  hq:            # headquarters: embedded Oxidized + manages the branch
    <<: *manager
    build: { context: ../.., dockerfile: Dockerfile }
    ports: ["18080:8080"]
    volumes: ["./:/e2e:ro"]
  branch:        # branch office: embedded Oxidized, managed remotely with an API key
    <<: *manager
    ports: ["18081:8080"]
    depends_on: [hq]
  r1: { build: fake_device, environment: { HOSTNAME_PROMPT: R1 } }
  r2: { build: fake_device, environment: { HOSTNAME_PROMPT: R2 } }
  r3: { build: fake_device, environment: { HOSTNAME_PROMPT: R3 } }
  gitea:
    image: docker.io/gitea/gitea:1.22
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__SSH_DOMAIN: gitea
      GITEA__database__DB_TYPE: sqlite3
    ports: ["13000:3000"]
